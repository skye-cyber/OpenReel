name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write
    actions: write

jobs:
    build:
        name: Build (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24.2.0"
                  cache: "npm"

            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libgtk-3-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libasound2-dev \
                    vainfo

            - name: Install frontend dependencies
              shell: bash
              run: |
                  rm -rf node_modules package-lock.json
                  npm install

            # - name: Ensure Tauri CLI native binding (Windows)
            #   if: runner.os == 'Windows'
            #   run: npm install @tauri-apps/cli-win32-x64-msvc --no-save
            #
            # - name: Ensure Tauri CLI native binding (macOS)
            #   if: runner.os == 'macOS'
            #   run: |
            #       ARCH=$(uname -m)
            #       if [ "$ARCH" = "arm64" ]; then
            #           npm install @tauri-apps/cli-darwin-arm64 --no-save
            #       else
            #           npm install @tauri-apps/cli-darwin-x64 --no-save
            #       fi
            #
            # - name: Ensure Tauri CLI native binding (Linux)
            #   if: runner.os == 'Linux'
            #   run: |
            #       ARCH=$(uname -m)
            #       if [ "$ARCH" = "aarch64" ]; then
            #           npm install @tauri-apps/cli-linux-arm64-gnu --no-save
            #       else
            #           npm install @tauri-apps/cli-linux-x64-gnu --no-save
            #       fi

            - name: Fetch FFmpeg/FFprobe sidecars
              run: npm run prepare:sidecars

            - name: Build and release
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: "OpenReel ${{ github.ref_name }}"
                  releaseDraft: true
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  generateReleaseNotes: true
                  args: ${{ matrix.os == 'ubuntu-latest' && '--bundles deb,rpm,appimage' || '' }}
