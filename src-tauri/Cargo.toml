[package]
name = "openreel"
version = "0.1.0"
description = "Media player"
authors = ["Wambua Mwikya aka Skye <swskye17@gmail.com>"]
license = "GNU"
repository = "https://github.com/skye-cyber/openreel.git"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "openreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
dirs="5"
walkdir = "2" # for dir scanning
notify = "7" # For watch+reporting
reqwest = { version = "0.12", features = ["json"] } # For plugins
libc = "0.2" # for getuid()
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
tauri-plugin-single-instance = "2"

# Global shortcut is desktop-only — this prevents Android/iOS build failures
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = false
